<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="110" fill="#e91e8c"/>
  <rect width="512" height="512" rx="110" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f48fb1" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ad1457" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Panier simplifié -->
  <g fill="white">
    <!-- poignée -->
    <path d="M180 160 Q180 120 256 120 Q332 120 332 160" stroke="white" stroke-width="28" fill="none" stroke-linecap="round"/>
    <!-- corps du panier -->
    <rect x="140" y="168" width="232" height="160" rx="20"/>
    <!-- roues -->
    <circle cx="196" cy="368" r="28"/>
    <circle cx="316" cy="368" r="28"/>
    <!-- lignes décoratives sur le panier -->
    <rect x="140" y="168" width="232" height="160" rx="20" fill="#e91e8c" opacity="0"/>
    <line x1="210" y1="192" x2="210" y2="304" stroke="#e91e8c" stroke-width="14" stroke-linecap="round"/>
    <line x1="256" y1="192" x2="256" y2="304" stroke="#e91e8c" stroke-width="14" stroke-linecap="round"/>
    <line x1="302" y1="192" x2="302" y2="304" stroke="#e91e8c" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
